name: Scraper

on:
  workflow_dispatch:

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: pip install requests beautifulsoup4 pandas lxml

      - name: Run
        run: python scraper.py

      - name: Save Data
        run: |
          git config user.name "bot"
          git config user.email "bot@github.com"
          git add -A
          git commit -m "Update master ESI directory" || exit 0
          git push
          
