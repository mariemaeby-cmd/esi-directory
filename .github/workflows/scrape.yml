name: Update ESI Clinical Directory

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 1 * *"

permissions:
  contents: write

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run ESI Directory Scraper
        run: |
          python scraper.py

      - name: Upload Dataset Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: esi-directory-dataset
          path: |
            esi_master.csv
            esi_master.json

      - name: Commit and Push to Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -f esi_master.json esi_master.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(data): auto-update verified ESI clinical directory [skip ci]" && git push)
          
